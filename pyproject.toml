[project]
name = "zero-shot-forecasting"
version = "0.1.0"
description = "Exploring time series foundation models (TSFMs): zero-shot forecasting, backtesting and anomaly detection on European electricity demand with Timestral"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "holidays>=0.107",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "timestral",
]

[tool.uv.sources]
timestral = { git = "https://github.com/mistralai/timestral.git" }
